name: Release Please

on:
  push:
    branches: [main]

# Opens/updates the release PR and, once it is merged, creates the tag and the
# GitHub Release. Needs "Allow GitHub Actions to create and approve pull
# requests" enabled in the repository settings.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA: this job has write access to the repository.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # PRs opened with GITHUB_TOKEN do not trigger ci.yml, and main requires its
      # `check` status. workflow_dispatch is the one event GITHUB_TOKEN may
      # trigger, so run the real CI on the release branch.
      - if: steps.release.outputs.pr
        name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
