name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sem isto o job herda o default do repositório, que pode ser read/write.
# A CI só lê o checkout — nada aqui precisa escrever no repositório.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Artefatos gerados estão em dia
        run: node scripts/build.mjs --check

      - name: JSON válido
        run: |
          rc=0
          for f in $(git ls-files '*.json'); do
            jq empty "$f" || { echo "INVÁLIDO: $f"; rc=1; }
          done
          exit $rc

      - name: Shell scripts sem erro de sintaxe
        run: |
          rc=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SINTAXE: $f"; rc=1; }
          done
          exit $rc

      - name: hooks.json tem a estrutura que o Claude Code espera
        run: |
          rc=0
          # Os eventos precisam estar aninhados sob a chave "hooks" — no topo, são ignorados.
          jq -e '.hooks | objects' hooks/hooks.json >/dev/null || {
            echo "hooks/hooks.json: falta a chave de topo \"hooks\""; rc=1;
          }
          for k in $(jq -r 'keys[]' hooks/hooks.json); do
            [ "$k" = "hooks" ] || { echo "chave inesperada no topo: $k"; rc=1; }
          done
          # Todo arquivo referenciado via CLAUDE_PLUGIN_ROOT precisa existir.
          for f in $(jq -r '[.. | .command? // empty] | .[]' hooks/hooks.json \
                     | grep -o '\${CLAUDE_PLUGIN_ROOT}/[^"]*' | sed 's#${CLAUDE_PLUGIN_ROOT}/##'); do
            test -f "$f" || { echo "hook referencia arquivo inexistente: $f"; rc=1; }
          done
          exit $rc

      - name: Agentes mantêm a integração com o caveman
        run: |
          rc=0
          for f in agents/*.md; do
            grep -q "skill caveman" "$f" || { echo "SEM REFERÊNCIA AO CAVEMAN: $f"; rc=1; }
          done
          grep -q "caveman-review" agents/code-reviewer.md || {
            echo "code-reviewer perdeu o formato /caveman-review"; rc=1;
          }
          exit $rc
